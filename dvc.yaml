stages:
  preprocess:
    cmd: python src/data_preprocessing.py
    deps:
      - src/data_preprocessing.py
      - data/raw/diabetic_data.csv
    params:
      - data
      - preprocessing
    outs:
      - data/processed/train.csv
      - data/processed/test.csv

  train:
    cmd: python src/model_trainer.py
    deps:
      - src/model_trainer.py
      - data/processed/train.csv
      - data/processed/test.csv
    params:
      - model
      - mlflow
    outs:
      - models/model.joblib
    metrics:
      - scores.json:
          cache: false